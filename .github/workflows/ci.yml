name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Test & Build Monorepo
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: plataforma
          POSTGRES_PASSWORD: password
          POSTGRES_DB: plataforma
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Restore pnpm Cache
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit Production Dependencies
        run: pnpm audit --prod --audit-level critical

      - name: Generate Prisma Client
        run: pnpm --filter @plataforma/api exec prisma generate
        env:
          DATABASE_URL: postgresql://plataforma:password@localhost:5432/plataforma?schema=public

      - name: Run Linter
        run: pnpm -r lint

      - name: Validate Prometheus Alert Rules
        run: |
          docker run --rm \
            --volume "$PWD/infra/monitoring:/rules:ro" \
            --entrypoint promtool \
            prom/prometheus@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996 \
            check rules /rules/nexus-alerts.yml
          docker run --rm \
            --volume "$PWD/infra/monitoring:/rules:ro" \
            --entrypoint promtool \
            prom/prometheus@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996 \
            test rules /rules/nexus-alerts.test.yml
          docker run --rm \
            --volume "$PWD/infra/monitoring:/rules:ro" \
            --entrypoint promtool \
            prom/prometheus@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996 \
            check config /rules/prometheus.yml

      - name: Test alpha preflight and Alertmanager configuration
        run: node --test scripts/__tests__/alpha-preflight.test.mjs scripts/monitoring/__tests__/render-alertmanager-config.test.mjs

      - name: Validate Alertmanager webhook configuration
        env:
          ALERTMANAGER_WEBHOOK_URL: https://alerts.example.com/incoming
          ALERTMANAGER_TEMPLATE_PATH: infra/monitoring/alertmanager.yml
          ALERTMANAGER_CONFIG_OUTPUT: ${{ runner.temp }}/alertmanager.yml
        run: |
          node scripts/monitoring/render-alertmanager-config.mjs
          docker run --rm \
            --volume "$RUNNER_TEMP/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro" \
            --entrypoint /bin/amtool \
            prom/alertmanager:v0.28.1@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba \
            check-config /etc/alertmanager/alertmanager.yml

      - name: Validate Caddy public edge configuration
        env:
          ACME_EMAIL: ops@example.com
          WEB_DOMAIN: app.example.com
          API_DOMAIN: api.example.com
          GITEA_DOMAIN: git.example.com
        run: |
          docker run --rm \
            --env ACME_EMAIL --env WEB_DOMAIN --env API_DOMAIN --env GITEA_DOMAIN \
            --volume "$PWD/infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Run Backend Unit & Integration Tests (with coverage thresholds)
        run: pnpm --filter @plataforma/api test:coverage
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://plataforma:***@localhost:5432/plataforma?schema=public
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_ACCESS_SECRET: test_access_secret_super_secure_123456789
          JWT_REFRESH_SECRET: test_refresh_secret_super_secure_987654321
          GITEA_WEBHOOK_SECRET: test_webhook_secret_super_secure_12345

      # Testes unitários do web (Vitest: game engine + stores). Gate real
      # desde o B04: dos 7 specs pré-existentes que falhavam, 6 foram
      # corrigidos no próprio spec e 1 foi pulado com TODO(B04) por bug
      # conhecido da engine (SceneTransitionManager ignora a duração
      # passada ao construtor) — ver engine.spec.ts.
      - name: Run Web Unit Tests (Vitest - game engine)
        run: pnpm --filter @plataforma/web test

      - name: Build Monorepo (Next.js & NestJS)
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000
          NODE_ENV: production

      - name: Verify Open Badges cryptography
        run: pnpm --filter @plataforma/api test:credentials

  # Smoke E2E com Playwright (apps/web/e2e): sobe Postgres/Redis, aplica
  # migrations, roda o seed (usuário aluno@plataforma.local), constrói
  # API+web, inicia a API e deixa o Playwright iniciar o web (webServer
  # do playwright.config.ts, porta 3001). Job independente: não bloqueia
  # o docker-build, mas falha visível reprova o workflow (B04).
  e2e:
    name: Playwright E2E Smoke
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: plataforma
          POSTGRES_PASSWORD: <redacted>
          POSTGRES_DB: plataforma
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://plataforma:password@localhost:5432/plataforma?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: <redacted>
      JWT_REFRESH_SECRET: <redacted>
      GITEA_WEBHOOK_SECRET: <redacted>
      NEXT_PUBLIC_API_URL: http://localhost:3000

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Restore pnpm Cache
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @plataforma/api exec prisma generate

      - name: Apply Migrations & Seed Data
        run: |
          pnpm db:migrate
          pnpm seed:data

      - name: Install Playwright Browsers (Chromium)
        run: pnpm --filter @plataforma/web exec playwright install --with-deps chromium

      - name: Build API & Web
        run: |
          pnpm --filter @plataforma/api build
          pnpm --filter @plataforma/web build
        env:
          NODE_ENV: production

      - name: Start API (background)
        run: |
          pnpm --filter @plataforma/api start &
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:3000/; then
              echo "API respondendo na porta 3000"
              break
            fi
            sleep 2
          done

      - name: Run Playwright E2E Smoke Tests
        run: pnpm --filter @plataforma/web test:e2e

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  docker-build:
    name: Build & Validate Docker Images
    runs-on: ubuntu-latest
    needs: [validate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            file: apps/api/Dockerfile.prod
          - name: web
            file: apps/web/Dockerfile.prod

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          load: true
          tags: plataforma-${{ matrix.name }}:latest
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:3000

      - name: Scan Docker Image for Critical Vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: plataforma-${{ matrix.name }}:latest
          format: table
          vuln-type: os,library
          ignore-unfixed: true
          severity: CRITICAL
          exit-code: '1'
