services:
  piston:
    image: ghcr.io/engineer-man/piston:latest@sha256:2f66b7456189c4d713aa986d98eccd0b6ee16d26c7ec5f21b30e942756fd127a
    privileged: true
    expose:
      - '2000'
    restart: unless-stopped
    networks:
      - piston-private
    environment:
      PISTON_DISABLE_NETWORKING: 'true'
      PISTON_RUN_TIMEOUT: '5000'
      PISTON_RUN_CPU_TIME: '5000'
      PISTON_RUN_MEMORY_LIMIT: '268435456'
      PISTON_COMPILE_TIMEOUT: '10000'
      PISTON_COMPILE_MEMORY_LIMIT: '268435456'
      PISTON_MAX_PROCESS_COUNT: '64'
    volumes:
      - piston-packages:/piston/packages
    depends_on:
      piston-portugol-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:2000/api/v2/packages', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  piston-portugol-init:
    build:
      context: ./infra/piston/packages/portugol/2.7.5
      dockerfile: Dockerfile
    volumes:
      - piston-packages:/piston/packages
    restart: 'no'

  piston-init:
    image: node:22-alpine
    command: ['node', '/bootstrap/install-runtimes.mjs']
    volumes:
      - ./infra/piston/install-runtimes.mjs:/bootstrap/install-runtimes.mjs:ro
    restart: 'no'
    networks:
      - piston-private
    depends_on:
      piston:
        condition: service_healthy

  piston-gateway:
    build:
      context: ./infra/piston/gateway
      dockerfile: Dockerfile
    ports:
      - '${PISTON_BIND_IP:-127.0.0.1}:2000:2000'
    environment:
      PISTON_AUTH_TOKEN: ${PISTON_AUTH_TOKEN:?Generate the same 64-character token used by the API}
      PISTON_GATEWAY_MAX_CONCURRENT: ${PISTON_GATEWAY_MAX_CONCURRENT:-4}
    restart: unless-stopped
    networks:
      - piston-private
    depends_on:
      piston-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:2000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

networks:
  piston-private:

volumes:
  piston-packages:
