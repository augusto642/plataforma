services:
  db-migrate:
    environment:
      DATABASE_URL: ${TEST_DATABASE_URL:?Configure TEST_DATABASE_URL para o banco de teste}

  api:
    environment:
      DATABASE_URL: ${TEST_DATABASE_URL:?Configure TEST_DATABASE_URL para o banco de teste}
      PISTON_ENABLED: 'true'
      PISTON_URL: ${PISTON_URL:?Configure PISTON_URL para o gateway na rede privada}
      PISTON_AUTH_TOKEN: ${PISTON_AUTH_TOKEN:?Configure PISTON_AUTH_TOKEN para o gateway}
