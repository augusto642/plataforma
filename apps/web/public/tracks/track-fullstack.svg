<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" fill="none">
  <defs>
    <linearGradient id="fs-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181824" />
      <stop offset="100%" stop-color="#0E0E17" />
    </linearGradient>
    <linearGradient id="fs-grad-purple-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#996DFF" />
      <stop offset="50%" stop-color="#8257E5" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>
    <filter id="fs-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base Squircle -->
  <rect x="4" y="4" width="72" height="72" rx="18" fill="url(#fs-bg)" stroke="#27272A" stroke-width="1.5" />
  <rect x="4" y="4" width="72" height="72" rx="18" stroke="url(#fs-grad-purple-cyan)" stroke-width="1.5" stroke-opacity="0.35" />

  <!-- Code Window / Fullstack Layer Illustration -->
  <rect x="16" y="18" width="48" height="32" rx="6" fill="#12121A" stroke="#8257E5" stroke-width="1.2" stroke-dasharray="3 2" opacity="0.6" />
  
  <!-- TypeScript Symbol <TS> -->
  <g transform="translate(18, 22)">
    <rect width="18" height="18" rx="4" fill="#3178C6" fill-opacity="0.2" stroke="#3178C6" stroke-width="1" />
    <text x="9" y="13" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" fill="#00E5FF" text-anchor="middle">TS</text>
  </g>

  <!-- React Atom / Node Server Loop -->
  <ellipse cx="50" cy="31" rx="12" ry="5" transform="rotate(30 50 31)" stroke="#00E5FF" stroke-width="1.2" stroke-opacity="0.7" />
  <ellipse cx="50" cy="31" rx="12" ry="5" transform="rotate(-30 50 31)" stroke="#8257E5" stroke-width="1.2" stroke-opacity="0.7" />
  <circle cx="50" cy="31" r="2.5" fill="#04D361" filter="url(#fs-glow)" />

  <!-- Fullstack Connector Cable -->
  <path d="M28 50L40 58L52 50" stroke="url(#fs-grad-purple-cyan)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#fs-glow)" />
  <circle cx="40" cy="58" r="3" fill="#8257E5" stroke="#FFFFFF" stroke-width="1" />
  <path d="M40 58V64" stroke="#8257E5" stroke-width="2" stroke-linecap="round" />
</svg>
