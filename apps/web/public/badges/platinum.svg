<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="plat-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5F3FC"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="plat-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082F49"/>
      <stop offset="100%" stop-color="#0C1929"/>
    </linearGradient>
    <filter id="plat-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#38BDF8" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Shield Base -->
  <polygon points="50,4 92,24 92,76 50,96 8,76 8,24" fill="url(#plat-dark)" stroke="url(#plat-grad)" stroke-width="3.5" filter="url(#plat-glow)"/>
  <polygon points="50,12 84,28 84,72 50,88 16,72 16,28" fill="none" stroke="url(#plat-grad)" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.8"/>
  <!-- Platinum Crest -->
  <path d="M50 22L70 42L50 72L30 42L50 22Z" fill="none" stroke="url(#plat-grad)" stroke-width="3.5"/>
  <polygon points="50,30 63,43 50,62 37,43" fill="url(#plat-grad)"/>
  <circle cx="50" cy="45" r="4" fill="#FFFFFF"/>
  <text x="50" y="83" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="900" fill="#E0F2FE" letter-spacing="0.1em">PLATINUM</text>
</svg>
