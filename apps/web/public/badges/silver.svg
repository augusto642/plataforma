<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="silver-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="silver-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="silver-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Shield Hex Base -->
  <polygon points="50,6 88,26 88,74 50,94 12,74 12,26" fill="url(#silver-dark)" stroke="url(#silver-grad)" stroke-width="3"/>
  <polygon points="50,14 80,31 80,69 50,86 20,69 20,31" fill="none" stroke="url(#silver-grad)" stroke-width="1.5" stroke-dasharray="3 2" opacity="0.6"/>
  <!-- Winged Core -->
  <path d="M50 26L65 42L50 56L35 42L50 26Z" fill="url(#silver-grad)" filter="url(#silver-glow)"/>
  <path d="M50 48L68 62L61 68L50 59L39 68L32 62L50 48Z" fill="url(#silver-grad)" opacity="0.85"/>
  <text x="50" y="82" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" fill="#E2E8F0" letter-spacing="0.1em">SILVER</text>
</svg>
