<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <!-- Border Gradient -->
    <linearGradient id="icon-badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8257E5"/>
      <stop offset="50%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#04D361"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="icon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#8257E5" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Container Squircle Background -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="#121217" stroke="url(#icon-badge-grad)" stroke-width="2.5" filter="url(#icon-glow)"/>

  <!-- N>< Center Elements (Centered in 128x128) -->
  <g transform="translate(18, 30)">
    <!-- N Letter (Solid White) -->
    <path d="M 4 52 L 4 16 L 13 16 L 31 40 L 31 16 L 39 16 L 39 52 L 31 52 L 13 28 L 13 52 Z" fill="#FFFFFF"/>
    
    <!-- Chevron > (Neon Green #04D361) -->
    <path d="M 48 20 L 61 34 L 48 48" stroke="#04D361" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Chevron < (Rocket Purple #8257E5) -->
    <path d="M 76 20 L 63 34 L 76 48" stroke="#8257E5" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Central Nexus Spark -->
    <circle cx="62" cy="34" r="2.8" fill="#FFFFFF"/>
    <circle cx="62" cy="34" r="1.4" fill="#04D361"/>
  </g>
</svg>
