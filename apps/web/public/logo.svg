<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 90" width="520" height="90" fill="none">
  <defs>
    <!-- Border Gradient -->
    <linearGradient id="badge-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8257E5"/>
      <stop offset="50%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#04D361"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="badge-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#8257E5" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- BADGE SQUIRCLE ICON (x: 10, y: 10, width: 94, height: 70) -->
  <g transform="translate(10, 10)">
    <!-- Container Squircle Background -->
    <rect width="94" height="70" rx="18" fill="#121217" stroke="url(#badge-border-grad)" stroke-width="2"/>
    
    <!-- Inner N>< Elements -->
    <g transform="translate(4, 2)">
      <!-- N Letter (Crisp Solid White) -->
      <path d="M 14 48 L 14 18 L 21 18 L 35 38 L 35 18 L 41 18 L 41 48 L 35 48 L 21 28 L 21 48 Z" fill="#FFFFFF"/>
      
      <!-- Chevron > (Neon Green #04D361) -->
      <path d="M 48 22 L 59 33 L 48 44" stroke="#04D361" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Chevron < (Rocket Purple #8257E5) -->
      <path d="M 72 22 L 61 33 L 72 44" stroke="#8257E5" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Central Nexus Spark -->
      <circle cx="60" cy="33" r="2.2" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- WORDMARK TYPOGRAPHY: NEXUS CODE -->
  <g transform="translate(122, 16)">
    <!-- "NEXUS" in Bold Crisp White -->
    <text x="0" y="36" font-family="'Space Grotesk', system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="36" font-weight="800" letter-spacing="-0.02em" fill="#FFFFFF">NEXUS</text>
    
    <!-- "CODE" in Emerald Green Accent -->
    <text x="142" y="36" font-family="'Space Grotesk', system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="36" font-weight="800" letter-spacing="-0.02em" fill="#04D361">CODE</text>

    <!-- Tagline in Monospace Dev Style -->
    <text x="2" y="56" font-family="'Fira Code', monospace" font-size="10.5" font-weight="600" letter-spacing="0.22em" fill="#A1A1AA">
      ACTIVE CODE PLATFORM // DEV FIRST
    </text>
  </g>
</svg>
