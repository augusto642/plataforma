<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <!-- Gradients -->
    <radialGradient id="og-bg-glow1" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#8257E5" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#070A12" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="og-bg-glow2" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#04D361" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#070A12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="og-purple-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="50%" stop-color="#8257E5"/>
      <stop offset="100%" stop-color="#0070F3"/>
    </linearGradient>
    <linearGradient id="og-neon-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#00B37E"/>
      <stop offset="100%" stop-color="#04D361"/>
    </linearGradient>
    <linearGradient id="text-white-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <filter id="og-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Dark Base -->
  <rect width="1200" height="630" fill="#070A12"/>
  
  <!-- Atmosphere Radial Lights -->
  <rect width="1200" height="630" fill="url(#og-bg-glow1)"/>
  <rect width="1200" height="630" fill="url(#og-bg-glow2)"/>

  <!-- Cyber Matrix Grid -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="120" y1="0" x2="120" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/>
  </g>

  <!-- Outer Frame Border -->
  <rect x="24" y="24" width="1152" height="582" rx="20" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>

  <!-- TOP LEFT LOGO EMBED -->
  <g transform="translate(80, 75)">
    <!-- Icon Squircle -->
    <rect width="64" height="64" rx="18" fill="#0E1424" stroke="url(#og-purple-blue)" stroke-width="1.5"/>
    <path d="M24 20L14 32L24 44" stroke="url(#og-purple-blue)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M40 20L50 32L40 44" stroke="url(#og-purple-blue)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M36 17L27 31H34L28 47L40 29H32L36 17Z" fill="url(#og-neon-green)" filter="url(#og-glow)"/>
    
    <!-- Platform Name -->
    <text x="80" y="44" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="-0.02em">SYNTAX</text>
    <circle cx="218" cy="40" r="4" fill="#04D361" filter="url(#og-glow)"/>
    <text x="234" y="44" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700" fill="#8257E5">LMS</text>
  </g>

  <!-- PILL BADGE -->
  <g transform="translate(80, 180)">
    <rect width="330" height="36" rx="18" fill="rgba(130, 87, 229, 0.15)" stroke="url(#og-purple-blue)" stroke-width="1"/>
    <circle cx="20" cy="18" r="4" fill="#04D361"/>
    <text x="36" y="23" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#A78BFA" letter-spacing="0.05em">SANDBOX ENGINE &bull; AI SOCRATIC TUTOR</text>
  </g>

  <!-- MAIN HERO HEADLINE -->
  <text x="80" y="290" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="54" font-weight="800" fill="url(#text-white-grad)" letter-spacing="-0.03em">
    Aprenda Programação
  </text>
  <text x="80" y="356" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="54" font-weight="800" fill="url(#og-neon-green)" letter-spacing="-0.03em">
    com Prática e Feedback Real.
  </text>

  <!-- SUBTITLE -->
  <text x="80" y="420" font-family="'Inter', sans-serif" font-size="20" font-weight="400" fill="#94A3B8">
    Execução isolada em sandbox, tutoria socrática por IA, ranking de talentos e gamificação.
  </text>

  <!-- FOOTER STATS / CHIPS -->
  <g transform="translate(80, 480)">
    <!-- Chip 1: Monaco Editor -->
    <rect width="180" height="48" rx="12" fill="#0F172A" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="20" y="30" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#E2E8F0">&gt;_ Monaco + Piston</text>

    <!-- Chip 2: AI Socrático -->
    <rect x="200" width="160" height="48" rx="12" fill="#0F172A" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="220" y="30" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#C084FC">&#x2728; Tutor IA</text>

    <!-- Chip 3: Git & Ranking -->
    <rect x="380" width="180" height="48" rx="12" fill="#0F172A" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="400" y="30" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#04D361">&#x1F525; XP &amp; Ligas</text>
  </g>

  <!-- RIGHT SIDE INTERACTIVE CODE MOCKUP / TERMINAL WINDOW -->
  <g transform="translate(710, 150)">
    <!-- Terminal Box -->
    <rect width="410" height="390" rx="16" fill="#0B0F19" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" filter="url(#og-glow)"/>
    <!-- Terminal Header -->
    <rect width="410" height="42" rx="16" fill="#13192B"/>
    <circle cx="22" cy="21" r="5" fill="#EF4444"/>
    <circle cx="38" cy="21" r="5" fill="#F59E0B"/>
    <circle cx="54" cy="21" r="5" fill="#10B981"/>
    <text x="205" y="26" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748B">solution.ts — Passed 100/100</text>

    <!-- Code Snippet -->
    <g transform="translate(20, 70)" font-family="'JetBrains Mono', monospace" font-size="13">
      <text y="0" fill="#8257E5">function <tspan fill="#00E5FF">solveChallenge</tspan><tspan fill="#E2E8F0">(input: </tspan><tspan fill="#F59E0B">number[]</tspan><tspan fill="#E2E8F0">) {</tspan></text>
      <text y="28" fill="#64748B">  // Sandbox evaluation</text>
      <text y="56" fill="#E2E8F0">  <tspan fill="#8257E5">const</tspan> result = input.<tspan fill="#00E5FF">filter</tspan>(x =&gt; x % 2 === 0);</text>
      <text y="84" fill="#8257E5">  return <tspan fill="#E2E8F0">result;</tspan></text>
      <text y="112" fill="#E2E8F0">}</text>

      <!-- Test passed badge -->
      <g transform="translate(0, 140)">
        <rect width="370" height="52" rx="10" fill="rgba(4, 211, 97, 0.1)" stroke="#04D361" stroke-width="1"/>
        <circle cx="24" cy="26" r="8" fill="#04D361"/>
        <path d="M20 26L23 29L28 23" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="42" y="24" font-weight="700" fill="#04D361" font-size="13">Todos os 5 testes passaram</text>
        <text x="42" y="42" fill="#94A3B8" font-size="11">Duração: 48ms &bull; +120 XP Ganho</text>
      </g>

      <!-- AI Tutor Prompt Feedback -->
      <g transform="translate(0, 210)">
        <rect width="370" height="64" rx="10" fill="rgba(130, 87, 229, 0.12)" stroke="#8257E5" stroke-width="1"/>
        <text x="14" y="22" font-weight="700" fill="#A78BFA" font-size="12">&#x1F916; Tutor IA Socrático:</text>
        <text x="14" y="42" fill="#CBD5E1" font-size="11">Excelente complexidade O(N)! Como você</text>
        <text x="14" y="56" fill="#CBD5E1" font-size="11">otimizaria o consumo de memória in-place?</text>
      </g>
    </g>
  </g>
</svg>
