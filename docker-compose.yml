# =============================================================================
# Compose de PRODUÇÃO — imagens de build (Dockerfile.prod), sem `pnpm dev`.
#
# Subir:  docker compose up -d --build
# Parar:  docker compose down          (volumes preservados; `down -v` apaga)
#
# Variáveis OBRIGATÓRIAS no `.env` (a API recusa subir sem elas):
#   JWT_ACCESS_SECRET, JWT_REFRESH_SECRET — `openssl rand -hex 48`
#   GITEA_WEBHOOK_SECRET                 — `openssl rand -hex 32`
#   POSTGRES_PASSWORD                    — `openssl rand -hex 32`
#   REDIS_PASSWORD                       — `openssl rand -hex 32`
# M16 (Lote 4): NÃO há mais defaults para senhas — o compose RECUSA subir
# sem POSTGRES_PASSWORD e REDIS_PASSWORD (`${VAR:?msg}` = fail-closed, erro
# claro no `docker compose config/up`). O Redis NÃO publica mais a porta
# 6379 no host: só a API o alcança pela rede interna, e ele exige senha.
# Opcionais com default: POSTGRES_USER/DB/PORT, API_PORT, WEB_PORT,
# GITEA_HTTP_PORT/SSH_PORT, GITEA_PUBLIC_URL, GITEA_DOMAIN,
# GITEA_SSH_DOMAIN, GITEA_ENABLED, ALPHA_FREE_MODE, CORS_ORIGIN,
# NEXT_PUBLIC_API_URL, WEB_PUBLIC_URL, WEB_DOMAIN, API_DOMAIN, ACME_EMAIL
# e ALERTMANAGER_WEBHOOK_URL. Portas de aplicação ficam no loopback; Caddy
# publica 80/443 somente no perfil `public`. O perfil `monitoring` exige
# METRICS_TOKEN e um webhook HTTPS compatível com payloads Alertmanager.
#
# Notas:
# - `db-migrate` aplica as migrations ANTES da API subir (a API NÃO roda
#   migrations no boot; `RUN_MIGRATIONS=true` só para deploy desacoplado).
# - A6: `DATABASE_URL` carrega `connection_limit=21&pool_timeout=10` e o
#   Postgres tem `statement_timeout=30000` no servidor (ver
#   apps/api/src/prisma/prisma.service.ts para a medição/justificativa).
# - Dev local NÃO usa este arquivo: rode `pnpm dev` na raiz (o compose de
#   dev com volume mounts + `pnpm dev` foi substituído por este de deploy).
# =============================================================================
services:
  postgres:
    image: postgres:16-alpine
    # A6: trava por query no servidor (30 s) — 1 query lenta não segura uma
    # conexão do pool indefinidamente. O pool também fixa o timeout por
    # conexão (statement_timeout no PrismaService).
    command: ["postgres", "-c", "statement_timeout=30000"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plataforma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env (openssl rand -hex 32)}
      POSTGRES_DB: ${POSTGRES_DB:-plataforma}
    # Blindagem de segurança: vinculado exclusivamente ao loopback do host (127.0.0.1)
    # para evitar exposição pública direta em ambientes de produção com IP externo.
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init-gitea.sql:/docker-entrypoint-initdb.d/init-gitea.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-plataforma}']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # M16 (Lote 4): senha obrigatória (--requirepass) e SEM `ports`: o Redis
    # não é publicado no host — só a API o alcança pela rede interna.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env (openssl rand -hex 32)}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env (openssl rand -hex 32)}"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping']
      interval: 5s
      timeout: 3s
      retries: 5

  gitea:
    image: gitea/gitea:1.24.5
    environment:
      USER_UID: '1000'
      USER_GID: '1000'
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: postgres:5432
      GITEA__database__NAME: gitea
      GITEA__database__USER: ${POSTGRES_USER:-plataforma}
      GITEA__database__PASSWD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env (openssl rand -hex 32)}
      GITEA__database__SSL_MODE: disable
      GITEA__server__ROOT_URL: ${GITEA_PUBLIC_URL:-http://localhost:${GITEA_HTTP_PORT:-3030}/}
      GITEA__server__DOMAIN: ${GITEA_DOMAIN:-localhost}
      GITEA__server__SSH_DOMAIN: ${GITEA_SSH_DOMAIN:-localhost}
      GITEA__server__SSH_PORT: '${GITEA_SSH_PORT:-2222}'
      GITEA__server__HTTP_PORT: '3000'
      GITEA__webhook__ALLOWED_HOST_LIST: http://api:3000
      GITEA__webhook__DELIVER_TIMEOUT: '30'
    ports:
      - '127.0.0.1:${GITEA_HTTP_PORT:-3030}:3000'
      - '127.0.0.1:${GITEA_SSH_PORT:-2222}:22'
    volumes:
      - giteadata:/data
    depends_on:
      postgres:
        condition: service_healthy

  piston:
    profiles: ['local-piston']
    image: ghcr.io/engineer-man/piston:latest@sha256:2f66b7456189c4d713aa986d98eccd0b6ee16d26c7ec5f21b30e942756fd127a
    # O upstream do Piston exige privileged para seu mecanismo de isolamento.
    # Mantenha-o na rede do sandbox, sem porta publicada no host.
    privileged: true
    # O digest imutável impede que uma mudança na tag latest troque o runtime
    # sem revisão; a API o acessa somente pela sandbox-net.
    expose:
      - '2000'
    restart: unless-stopped
    networks:
      - sandbox-net
    environment:
      - PISTON_DISABLE_NETWORKING=true
      - PISTON_RUN_TIMEOUT=5000
      - PISTON_RUN_CPU_TIME=5000
      - PISTON_RUN_MEMORY_LIMIT=268435456
      - PISTON_COMPILE_TIMEOUT=10000
      - PISTON_COMPILE_MEMORY_LIMIT=268435456
      - PISTON_MAX_PROCESS_COUNT=64
    volumes:
      - piston-packages:/piston/packages
    depends_on:
      piston-portugol-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:2000/api/v2/packages', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Sprint 23: provisiona o pacote customizado "portugol" (console
  # oficial do Portugol Studio) no volume do Piston. A API de pacotes
  # do Piston (usada pelo piston-init) só instala do índice oficial —
  # pacote customizado é copiado para o volume com os marcadores do
  # instalador. Ver infra/piston/packages/portugol/README.md.
  piston-portugol-init:
    profiles: ['local-piston']
    build:
      context: ./infra/piston/packages/portugol/2.7.5
      dockerfile: Dockerfile
    volumes:
      - piston-packages:/piston/packages
    restart: "no"
    networks:
      - sandbox-net

  piston-init:
    profiles: ['local-piston']
    image: curlimages/curl:latest
    networks:
      - default
      - sandbox-net
    depends_on:
      piston:
        condition: service_healthy
    restart: "no"
    command: >
      sh -c '
        echo "==> [piston-init] Instalando runtimes do Sandbox via API REST do Piston..."
        curl -s -X POST http://piston:2000/api/v2/packages -H "Content-Type: application/json" -d "{\"language\":\"node\",\"version\":\"20.11.1\"}" || true
        curl -s -X POST http://piston:2000/api/v2/packages -H "Content-Type: application/json" -d "{\"language\":\"python\",\"version\":\"3.12.0\"}" || true
        curl -s -X POST http://piston:2000/api/v2/packages -H "Content-Type: application/json" -d "{\"language\":\"java\",\"version\":\"15.0.2\"}" || true
        echo "==> [piston-init] Runtimes do Sandbox provisionados."
      '

  db-migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.prod
    # Imagem prod não tem pnpm: usa o binário do Prisma instalado no build.
    command: ["sh", "-c", "cd /app/apps/api && node_modules/.bin/prisma migrate deploy"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-plataforma}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env (openssl rand -hex 32)}@postgres:5432/${POSTGRES_DB:-plataforma}?connection_limit=21&pool_timeout=10
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.prod
    volumes:
      - knowledgecontent:/app/content
      - knowledgedata:/app/data
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    networks:
      - default
      - sandbox-net
    environment:
      NODE_ENV: production
      PORT: '3000'
      KNOWLEDGE_CONTENT_DIR: /app/content
      PIPELINE_BUDGET_DIR: /app/data
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:${WEB_PORT:-3001}}
      DATABASE_URL: postgresql://${POSTGRES_USER:-plataforma}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env (openssl rand -hex 32)}@postgres:5432/${POSTGRES_DB:-plataforma}?connection_limit=21&pool_timeout=10
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?defina JWT_ACCESS_SECRET no .env (openssl rand -hex 48)}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?defina JWT_REFRESH_SECRET no .env (openssl rand -hex 48)}
      CERTIFICATE_HMAC_SECRET: ${CERTIFICATE_HMAC_SECRET:?defina CERTIFICATE_HMAC_SECRET no .env (openssl rand -hex 32)}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      REDIS_URL: redis://:${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env (openssl rand -hex 32)}@redis:6379
      GITEA_URL: http://gitea:3000
      GITEA_ENABLED: ${GITEA_ENABLED:-true}
      GITEA_TOKEN: ${GITEA_TOKEN:-}
      GITEA_WEBHOOK_SECRET: ${GITEA_WEBHOOK_SECRET:?defina GITEA_WEBHOOK_SECRET no .env (openssl rand -hex 32)}
      GITEA_ORG: ${GITEA_ORG:-plataforma}
      PISTON_ENABLED: ${PISTON_ENABLED:-false}
      PISTON_URL: ${PISTON_URL:-http://piston:2000}
      PISTON_AUTH_TOKEN: ${PISTON_AUTH_TOKEN:-}
      PISTON_MAX_CONCURRENT: ${PISTON_MAX_CONCURRENT:-4}
      BILLING_MODE: ${BILLING_MODE:-test}
      BILLING_PROVIDER: ${BILLING_PROVIDER:-simulated}
      ALPHA_FREE_MODE: ${ALPHA_FREE_MODE:-false}
      BILLING_WEBHOOK_SECRET: ${BILLING_WEBHOOK_SECRET:?defina BILLING_WEBHOOK_SECRET no .env (openssl rand -hex 32)}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      REFERENCE_CONNECTOR_KEY_SHA256: ${REFERENCE_CONNECTOR_KEY_SHA256:-}
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      JOB_RESEARCH_DAILY_BUDGET: ${JOB_RESEARCH_DAILY_BUDGET:-0}
      JOB_RESEARCH_TIMEOUT_MS: ${JOB_RESEARCH_TIMEOUT_MS:-8000}
      MP_TEST_ACCESS_TOKEN: ${MP_TEST_ACCESS_TOKEN:-}
      MP_TEST_PAYER_EMAIL: ${MP_TEST_PAYER_EMAIL:-}
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-http://localhost:${WEB_PORT:-3001}}
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.prod
      args:
        # NEXT_PUBLIC_API_URL é embutido no build Next (não dá para trocar
        # só com env em runtime): defina a URL pública da API no .env.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${API_PORT:-3000}}
        NEXT_PUBLIC_ALPHA_FREE_MODE: ${ALPHA_FREE_MODE:-false}
    ports:
      - '127.0.0.1:${WEB_PORT:-3001}:3001'
    environment:
      API_URL: http://api:3000
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-3000}
    depends_on:
      api:
        condition: service_healthy

  caddy:
    profiles: ['public']
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-}
      WEB_DOMAIN: ${WEB_DOMAIN:-}
      API_DOMAIN: ${API_DOMAIN:-}
      GITEA_DOMAIN: ${GITEA_DOMAIN:-}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
      gitea:
        condition: service_started
    restart: unless-stopped

  alertmanager-config-init:
    profiles: ['monitoring']
    image: node:22-alpine@sha256:1314fb30ec37592d5845e5a160d522c0e680972aa534549940b8d73bde88481a
    command: ['node', '/scripts/render-alertmanager-config.mjs']
    environment:
      ALERTMANAGER_WEBHOOK_URL: ${ALERTMANAGER_WEBHOOK_URL:-}
      ALERTMANAGER_TEMPLATE_PATH: /templates/alertmanager.yml
      ALERTMANAGER_CONFIG_OUTPUT: /config/alertmanager.yml
    volumes:
      - ./infra/monitoring/alertmanager.yml:/templates/alertmanager.yml:ro
      - ./scripts/monitoring/render-alertmanager-config.mjs:/scripts/render-alertmanager-config.mjs:ro
      - alertmanagerconfig:/config
    restart: 'no'

  alertmanager:
    profiles: ['monitoring']
    image: prom/alertmanager:v0.28.1@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --cluster.listen-address=
      - --web.listen-address=:9093
    ports:
      - '127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093'
    volumes:
      - alertmanagerconfig:/etc/alertmanager:ro
      - alertmanagerdata:/alertmanager
    depends_on:
      alertmanager-config-init:
        condition: service_completed_successfully
    restart: unless-stopped

  prometheus:
    profiles: ['monitoring']
    image: prom/prometheus@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --config.expand-env
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:?defina METRICS_TOKEN no .env (openssl rand -hex 32)}
    ports:
      - '127.0.0.1:${PROMETHEUS_PORT:-9090}:9090'
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/nexus-alerts.yml:/etc/prometheus/nexus-alerts.yml:ro
      - prometheusdata:/prometheus
    depends_on:
      api:
        condition: service_healthy
      alertmanager:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  giteadata:
  knowledgecontent:
  knowledgedata:
  piston-packages:
  redisdata:
  prometheusdata:
  alertmanagerconfig:
  alertmanagerdata:
  caddydata:
  caddyconfig:

networks:
  # Rede do sandbox: só a API alcança o Piston; o Piston não alcança
  # postgres/redis/gitea (rede default). Nota: a rede precisa ter egress
  # para permitir `ppman install` dos runtimes no primeiro boot.
  sandbox-net: {}
