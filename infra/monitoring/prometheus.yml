global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  # Caminho relativo: resolvido em relação ao diretório do prometheus.yml.
  # Vale nos dois layouts: CI monta infra/monitoring em /rules e a produção
  # (docker-compose, profile monitoring) monta em /etc/prometheus.
  - nexus-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: nexus-api
    metrics_path: /metrics/prometheus
    authorization:
      type: Bearer
      credentials: "${METRICS_TOKEN}"
    static_configs:
      - targets: ["api:3000"]
