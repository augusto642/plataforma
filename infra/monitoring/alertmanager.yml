global:
  resolve_timeout: 5m

route:
  receiver: nexus-alpha-webhook
  group_by: [alertname, job, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: nexus-alpha-webhook
    webhook_configs:
      - url: __ALERTMANAGER_WEBHOOK_URL__
        send_resolved: true
